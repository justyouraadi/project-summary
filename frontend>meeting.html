<!DOCTYPE html>
<html>
<head>
    <title>Virtual Court</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>

<h2>Virtual Court Room</h2>

<input id="username" placeholder="Enter Name">
<input id="room" placeholder="Room ID">
<button onclick="joinRoom()">Join</button>

<br><br>

<input type="file" id="audioFile">
<button onclick="uploadAudio()">Upload WAV</button>

<pre id="output"></pre>

<script>
const socket = io("http://localhost:3046");

function joinRoom() {
    const username = document.getElementById("username").value;
    const room = document.getElementById("room").value;

    socket.emit("join", {
        username: username,
        room: room
    });

    document.getElementById("output").innerText =
        username + " joined room " + room;
}

function uploadAudio() {
    const file = document.getElementById("audioFile").files[0];
    const room = document.getElementById("room").value;

    const formData = new FormData();
    formData.append("audio", file);
    formData.append("room", room);

    fetch("http://localhost:3046/upload", {
        method: "POST",
        body: formData
    });

    document.getElementById("output").innerText +=
        "\nAudio uploaded. Processing...";
}

socket.on("processing", function(data) {
    document.getElementById("output").innerText +=
        "\n" + data.message;
});

socket.on("result", function(data) {
    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
});
</script>

</body>
</html>
